<!DOCTYPE html>
<html lang="vi">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="bo_anh">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>bo_anh</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="music.css">
</head>
<body>
  <main id="game" aria-label="BơAnh Alliance"></main>
  <section id="music" aria-label="Nhạc nền SoundCloud">
    <div class="music-toolbar">
      <label class="music-volume-control" for="music-volume">
        <span>Âm lượng</span>
        <input id="music-volume" type="range" min="0" max="100" step="1" value="30" aria-valuetext="30%">
        <output id="music-volume-value" for="music-volume">30%</output>
      </label>
      <button id="music-toggle" type="button" aria-label="Bật nhạc" title="Bật nhạc" aria-pressed="false">🔇</button>
    </div>
    <div id="music-panel" aria-hidden="true" inert>
      <div class="music-options">
        <label><input id="music-repeat" type="checkbox" checked> Lặp playlist</label>
        <a href="https://soundcloud.com/s-ng-mai-nguy-n-906756930/sets/14-casper" target="_blank" rel="noopener noreferrer">Mở trên SoundCloud</a>
      </div>
      <p id="music-status" role="status" aria-live="polite"></p>
      <div id="music-player"></div>
    </div>
  </section>
  <script src="music.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
